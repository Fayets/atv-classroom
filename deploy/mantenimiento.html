<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f0e9">
<title>ATV Classroom</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box;
    text-align: center; background: #f3f0e9; color: #242321; font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  svg { width: 54px; height: auto; margin-bottom: 10px; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 15px; color: #6d6862; }
  .carga { width: 26px; height: 26px; margin-top: 18px; border-radius: 50%; border: 2.5px solid rgba(36,35,33,.14); border-top-color: #ff2518; animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <svg viewBox="0 0 205 281" aria-label="ATV"><path fill="#242321" d="M0 71 L80 0 L185 0 L130 59 L69 103 L69 220 L9 281 L0 281 Z"/><path fill="#242321" d="M191 0 L205 0 L205 211 L127 281 L15 281 L75 222 L136 183 L136 61 Z"/></svg>
  <h1>Estamos mejorando ATV Classroom</h1>
  <p>Vuelve en unos segundos.</p>
  <span class="carga" aria-hidden="true"></span>
  <script>
    // Esta página la muestra nginx mientras el classroom se reinicia: apenas vuelve, se recarga sola.
    setInterval(function () {
      fetch('/api/salud?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload() }).catch(function () {})
    }, 2000)
  </script>
</body>
</html>
