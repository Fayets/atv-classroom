<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El ícono de la pestaña: la A/V de ATV, gris oscuro sobre pestañas claras y gris claro sobre oscuras -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-oscuro.png?v=3" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-claro.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-oscuro.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ATV" />
    <!-- Las tipografías de marca están en public/fonts (styles/fuentes.css); de Google solo la monoespaciada -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>ATV Classroom</title>
    <script>
      // El modo (claro / oscuro / auto) antes de pintar, para que no parpadee. Ver src/utils/modo.js.
      try {
        var modo = localStorage.getItem('atv_modo')
        var hora = new Date().getHours()
        if (modo === 'azul' || modo === 'oscuro' || (modo === 'auto' && (hora >= 20 || hora < 7))) {
          document.documentElement.dataset.modo = 'azul'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#201f1e')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
